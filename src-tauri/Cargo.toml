[package]
name = "echoideal"
version = "0.1.0"
description = "EchoIdeal - A lightning-fast, privacy-first AI assistant for meetings, interviews, and conversations."
authors = ["EchoIdeal"]
license = "GPL-3.0"
repository = "https://github.com/Agbobli5373/EchoIdeal"
homepage = "https://github.com/Agbobli5373/EchoIdeal"
documentation = "https://github.com/Agbobli5373/EchoIdeal/wiki"
readme = "../README.md"
keywords = ["ai-assistant", "tauri", "desktop-app", "privacy-first", "meeting-assistant"]
categories = ["gui", "multimedia", "accessibility", "science", "development-tools"]
edition = "2021"

[features]
default = ["premium_unlocked"]
premium_unlocked = []
# Some upstream macros still reference this legacy feature flag in `cfg(feature = "cargo-clippy")`.
# Defining it here prevents Rust's `unexpected_cfgs` lint from warning during builds.
cargo-clippy = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "echoideal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenv = "0.15"

[dependencies]
tauri = { version = "2.10", features = ["macos-private-api"] }
tauri-plugin-opener = "2.5"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
tauri-plugin-http = "2.5.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-keychain = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.6"
xcap = "0.0.12"
base64 = "0.22"
cpal = "0.15.3"
hound = "3.5.1"
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19.0"
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
dotenv = "0.15"
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
ringbuf = "0.4.8"
# Echo cancellation and speech detection for the microphone
sonora = "0.2"
earshot = "1.2"
# Voice fingerprints, to tell the other side's speakers apart
tract-onnx = "0.23"
realfft = "3.5"
sha2 = "0.10"
tauri-plugin-shell = "2.3.1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-posthog = "0.2.4"
tauri-plugin-machine-uid = "0.1.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
cidre = "0.11.3"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19.0"
windows = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.0"

# The voice-fingerprint model is far too slow unoptimised, so dev builds optimise
# the engine that runs it.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
